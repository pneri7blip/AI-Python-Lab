name: Build Python Portfolio

on:
  workflow_dispatch:
  push:
    paths:
      - lab_forge.py
      - .github/workflows/python-portfolio.yml

permissions:
  contents: write

jobs:
  build-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run portfolio installer
        run: python lab_forge.py

      - name: Commit generated portfolio files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README_PYTHON_PORTFOLIO.md 02_python_fundamentals 03_ai_api_basics
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Generate Python portfolio materials'
            git push
          fi
